name: Publish to Maven Central

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-publish
    steps:
      - uses: actions/checkout@v4

      # Fail immediately with a readable message rather than after a full build,
      # since a missing credential otherwise surfaces as an opaque 401 at upload.
      - name: Check publishing credentials are present
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          missing=""
          [ -z "$MAVEN_CENTRAL_USERNAME" ] && missing="$missing MAVEN_CENTRAL_USERNAME"
          [ -z "$MAVEN_CENTRAL_PASSWORD" ] && missing="$missing MAVEN_CENTRAL_PASSWORD"
          [ -z "$SIGNING_KEY" ] && missing="$missing SIGNING_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "MAVEN_CENTRAL_USERNAME and MAVEN_CENTRAL_PASSWORD are a Central Portal"
            echo "user token, generated under Account on central.sonatype.com. They are"
            echo "not the account login. SIGNING_KEY is an ASCII-armoured GPG private key"
            echo "whose public half has been published to a keyserver."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew :tolinku:testDebugUnitTest

      - name: Publish
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :tolinku:publishReleasePublicationToMavenCentralRepository --no-daemon

      # Uploading through the OSSRH compatibility endpoint leaves the artifacts in
      # an OSSRH-style staging repository, which does not appear in the Central
      # Portal on its own. This promotes it so it shows up under Deployments.
      # Without this the upload succeeds and then nothing is visible anywhere,
      # which is exactly how it looked the first time.
      - name: Promote the staging repository into the Central Portal
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          auth=$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)
          # user_managed stages the deployment for review rather than releasing it.
          # Releasing is irreversible, so it stays a deliberate click.
          code=$(curl -sS -o /tmp/promote.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $auth" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/com.tolinku?publishing_type=user_managed")
          echo "HTTP $code"
          cat /tmp/promote.txt || true
          echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Could not promote the staging repository. The artifacts uploaded but will not appear in the Portal."
            exit 1
          fi
          echo "Staged. Go to central.sonatype.com -> Deployments and publish it."
